[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shrinkray"
version = "0.1.0"
description = "Delta-debugging input minimizer with an empirical 1-minimality certificate"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "linluozi" }]
keywords = ["delta-debugging", "ddmin", "test-case-reduction", "debugging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
shrinkray = "shrinkray.__main__:main"

[tool.setuptools.packages.find]
include = ["shrinkray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"